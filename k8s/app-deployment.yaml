# 1. Definición del Deployment (Gestión de Pods/Contenedores)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: mi-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mi-web
  template:
    metadata:
      labels:
        app: mi-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80

---
# 2. Definición del Servicio (Balanceador de Carga Interno)
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: mi-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
